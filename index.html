<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Cards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.6rem;
      margin: 24px 0 8px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 0 16px 32px;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    /* ---------- Login Screen ---------- */

    .login-box {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      margin-top: 24px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .2s;
    }

    .login-box input:focus {
      border-color: #4361ee;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s;
    }

    .login-btn:active { transform: scale(.97); }

    .login-error {
      color: #ef233c;
      font-size: .9rem;
      margin-top: 12px;
      text-align: center;
    }

    /* ---------- User Header ---------- */

    .user-header {
      width: 100%;
      max-width: 480px;
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 0;
    }

    .user-header.visible {
      display: flex;
    }

    .user-name {
      font-size: .9rem;
      color: #666;
    }

    .logout-link {
      font-size: .85rem;
      color: #ef233c;
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
      padding: 4px 8px;
    }

    /* ---------- File Select Screen ---------- */

    .file-list {
      width: 100%;
      list-style: none;
      margin-top: 16px;
    }

    .file-list li {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .15s;
    }

    .file-list li:active {
      transform: scale(.97);
    }

    .file-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .file-progress {
      font-size: .85rem;
      color: #666;
    }

    /* ---------- Mode Select Screen ---------- */

    .mode-btn-group {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-btn {
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s, background .2s;
      color: #fff;
    }

    .mode-btn:active { transform: scale(.97); }

    .mode-btn.flip { background: #4361ee; }
    .mode-btn.quiz { background: #7209b7; }
    .mode-btn.reset { background: #e5e5e5; color: #333; font-size: .95rem; padding: 14px; }

    .back-link {
      align-self: flex-start;
      margin-top: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #4361ee;
      color: #fff;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(67,97,238,.3);
      text-decoration: none;
      padding: 0;
    }

    /* ---------- Flip Card Screen ---------- */

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin: 16px 0 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #4361ee;
      border-radius: 3px;
      transition: width .3s;
    }

    .progress-text {
      font-size: .85rem;
      color: #666;
      margin-bottom: 16px;
    }

    .card-container {
      width: 100%;
      height: 220px;
      perspective: 800px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    .card-front {
      background: #fff;
    }

    .card-back {
      background: #4361ee;
      color: #fff;
      transform: rotateY(180deg);
    }

    .card-word {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
    }

    .card-hint {
      font-size: .85rem;
      color: #999;
      margin-top: 12px;
    }

    .card-back .card-hint {
      color: rgba(255,255,255,.7);
    }

    .card-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .card-actions button {
      flex: 1;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s;
    }

    .card-actions button:active { transform: scale(.97); }

    .btn-know {
      background: #2dc653;
      color: #fff;
    }

    .btn-dont-know {
      background: #ef233c;
      color: #fff;
    }

    /* ---------- Quiz Screen ---------- */

    .quiz-score {
      font-size: .95rem;
      color: #666;
      margin: 16px 0 8px;
    }

    .quiz-word {
      font-size: 2rem;
      font-weight: 700;
      margin: 16px 0 24px;
      text-align: center;
    }

    .quiz-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      padding: 16px 20px;
      font-size: 1.05rem;
      background: #fff;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      text-align: left;
    }

    .quiz-option:active { transform: scale(.98); }

    .quiz-option.correct {
      background: #d4edda;
      border-color: #2dc653;
    }

    .quiz-option.wrong {
      background: #f8d7da;
      border-color: #ef233c;
    }

    .quiz-option.disabled {
      pointer-events: none;
    }

    /* ---------- Settings Toggles ---------- */

    .setting-toggle {
      flex: 1;
      padding: 10px 12px;
      font-size: .9rem;
      font-weight: 600;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      color: #666;
      cursor: pointer;
      transition: all .2s;
    }

    .setting-toggle.active {
      border-color: #4361ee;
      background: #eef0ff;
      color: #4361ee;
    }

    /* ---------- Done Screen ---------- */

    .done-icon {
      font-size: 4rem;
      margin: 32px 0 16px;
    }

    .done-message {
      font-size: 1.2rem;
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }

    .done-btn {
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform .15s;
    }

    .done-btn:active { transform: scale(.97); }

    /* ---------- Quiz Done Animations ---------- */
    @keyframes confetti-fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    @keyframes firework-burst {
      0% { transform: translate(0,0) scale(0); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
    }
    @keyframes bubble-float {
      0% { transform: translateY(0) translateX(0); opacity: 1; }
      25% { transform: translateY(-28vh) translateX(15px); }
      50% { transform: translateY(-55vh) translateX(-15px); opacity: .8; }
      75% { transform: translateY(-82vh) translateX(10px); }
      100% { transform: translateY(-110vh) translateX(0); opacity: 0; }
    }
    .done-anim-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

  // ---- CSV Parsing ----
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const words = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const parts = line.split(',');
      if (parts.length < 2) continue;
      const word = parts[0].trim();
      const translation = parts.slice(1).join(',').trim();
      // Skip header row
      if (i === 0 && /^[a-z]+$/i.test(word) && /^[a-z]+$/i.test(translation)) continue;
      words.push({ word, translation });
    }
    return words;
  }

  // ---- Progress (localStorage, per user) ----

    return 'ec_' + currentUsername + '_' + file;

    const data = localStorage.getItem(progressKey(file));
    return data ? JSON.parse(data) : [];
  }

  function saveProgress(file, learnedWords) {
    localStorage.setItem(progressKey(file), JSON.stringify(learnedWords));
  }

  function resetProgress() {
    if (confirm('Reset all progress for this word set?')) {
      localStorage.removeItem(progressKey(currentFile));
      document.getElementById('mode-title').textContent =

  }

  // ---- Shuffle ----
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speakWord(text) {
    if (!window.speechSynthesis) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    utterance.pitch = 1;
    speechSynthesis.speak(utterance);
  }

  function speakRussianWord(text) {
    if (!window.speechSynthesis) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.9;
    utterance.pitch = 1;
    speechSynthesis.speak(utterance);
  }

  function speakQuizWord() {
    const q = quizQueue[quizIndex];
    if (!q) return;
    if (q.direction === 'ru-en') {
      speakRussianWord(q.translation);
    } else {
      speakWord(q.word);
    }
  }

  function selectFile(file, words) {
    currentFile = file;
    allWords = words;
    const learned = getProgress(file);
    const learnedCount = learned.filter(w => words.some(ww => ww.word === w)).length;
    document.getElementById('mode-title').textContent =
      file.replace('.csv', '') + ' (' + learnedCount + '/' + words.length + ' learned)';
    showScreen('screen-mode');
  }

  // Update file list display with current progress
  async function updateFileList() {
  if (filesLoadedOnce) return;      // <--- prevent double build on login
  filesLoadedOnce = true;

  try {
    const res = await fetch('words/files.json?t=' + Date.now());
    const files = await res.json();
    const list = document.getElementById('file-list');
    list.innerHTML = '';

    for (const file of files) {
      const csvRes = await fetch('words/' + file);
      const csvText = await csvRes.text();
      const words = parseCSV(csvText);
      const learned = getProgress(file);
      const learnedCount = learned.filter(w => words.some(ww => ww.word === w)).length;

      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <div class="file-name">${file.replace('.csv', '')}</div>
          <div class="file-progress">${learnedCount} / ${words.length} learned</div>
        </div>
        <div style="font-size:1.4rem; color:#999">&rsaquo;</div>
      `;
      li.onclick = () => selectFile(file, words);
      list.appendChild(li);
    }
  } catch (e) {
    document.getElementById('file-list').innerHTML =
      '<li style="color:#ef233c; justify-content:center">Failed to load word files.</li>';
  }
}


  // ---- Flip Card Mode ----
  function startFlip() {
    lastMode = 'flip';
    const learned = getProgress(currentFile);
    const unlearned = allWords.filter(w => !learned.includes(w.word));

    if (unlearned.length === 0) {
      showDone('You\'ve learned all the words!', allWords.length, allWords.length);
      return;
    }

    flipQueue = shuffle(unlearned);
    flipIndex = 0;
    flipLearned = 0;
    showScreen('screen-flip');
    renderFlipCard();
  }

  function renderFlipCard() {
    const card = document.getElementById('flip-card');
    card.classList.remove('flipped');
    const w = flipQueue[flipIndex];
    document.getElementById('flip-word').textContent = w.word;
    document.getElementById('flip-translation').textContent = w.translation;

    const total = flipQueue.length;
    const pct = Math.round((flipIndex / total) * 100);
    document.getElementById('flip-progress-bar').style.width = pct + '%';
    document.getElementById('flip-progress-text').textContent =
      (flipIndex + 1) + ' / ' + total + ' remaining';
    speakWord(w.word);
  }

  function flipCard() {
    document.getElementById('flip-card').classList.toggle('flipped');
  }

  function flipAnswer(known) {
  const currentWord = flipQueue[flipIndex].word;

  if (known) {
    const learned = getProgress(currentFile);
    if (!learned.includes(currentWord)) {
      learned.push(currentWord);
      saveProgress(currentFile, learned);
      // Update mode title with new learned count
      document.getElementById('mode-title').textContent =
        currentFile.replace('.csv', '') + ' (' + learned.length + '/' + allWords.length + ' learned)';
    }
    flipLearned++;
    }


    flipIndex++;
    if (flipIndex >= flipQueue.length) {
      const learned = getProgress(currentFile);
      showDone(
        'Session complete! You knew ' + flipLearned + ' out of ' + flipQueue.length + ' words.',
        learned.length, allWords.length
      );
    } else {
      renderFlipCard();
    }
  }

  // ---- Quiz Mode ----
  function startQuiz() {
    lastMode = 'quiz';
    clearQuizTimer();

    // Each word appears twice: once EN→RU and once RU→EN
    const queue = [];
    allWords.forEach(w => {
      queue.push({ ...w, direction: 'en-ru' });
      queue.push({ ...w, direction: 'ru-en' });
    });
    quizQueue = shuffle(queue);
    quizIndex = 0;
    quizCorrect = 0;
    quizTotal = 0;
    showScreen('screen-quiz');
    renderQuiz();
  }

  function renderQuiz() {
    clearQuizTimer();
    const q = quizQueue[quizIndex];
    const isRuEn = q.direction === 'ru-en';

    // Show question word
    document.getElementById('quiz-word').textContent = isRuEn ? q.translation : q.word;
    document.getElementById('quiz-score').textContent =
      'Score: ' + quizCorrect + ' / ' + quizTotal + '  |  ' + (quizIndex + 1) + ' of ' + quizQueue.length;

    // Speak in the appropriate language
    if (isRuEn) {
      speakRussianWord(q.translation);
    } else {
      speakWord(q.word);
    }

    // Build options: 1 correct + 3 distractors
    const distractors = allWords
      .filter(d => d.word !== q.word)
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);

    const options = shuffle([q, ...distractors]);
    const container = document.getElementById('quiz-options');
    container.innerHTML = '';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = isRuEn ? opt.word : opt.translation;
      btn.onclick = () => quizAnswer(btn, opt.word === q.word, q.word);
      container.appendChild(btn);
    });

    startQuizTimer();
  }

  function quizAnswer(btn, isCorrect, correctWord) {
    clearQuizTimer();
    quizTotal++;
    const buttons = document.querySelectorAll('.quiz-option');
    buttons.forEach(b => b.classList.add('disabled'));

    const q = quizQueue[quizIndex];
    const isRuEn = q.direction === 'ru-en';

    if (isCorrect) {
      btn.classList.add('correct');
      quizCorrect++;
    } else {
      btn.classList.add('wrong');
      // Highlight correct answer (direction-aware)
      const correctWordObj = allWords.find(w => w.word === correctWord);
      const correctText = isRuEn ? correctWordObj.word : correctWordObj.translation;
      buttons.forEach(b => {
        if (b.textContent === correctText) b.classList.add('correct');
      });
    }

    setTimeout(() => {
      quizIndex++;
      if (quizIndex >= quizQueue.length) {
        saveQuizResult(currentFile, quizCorrect, quizTotal);
        showDone(
          'Quiz done! Score: ' + quizCorrect + ' / ' + quizTotal,
          0, 0
        );
      } else {
        renderQuiz();
      }
    }, 1200);
  }

  // ---- Timer Functions ----
  function startQuizTimer() {
    const timerDiv = document.getElementById('quiz-timer');
    const timerText = document.getElementById('quiz-timer-text');

    if (quizTimerSec === 0) {
      timerDiv.style.display = 'none';
      return;
    }

    timerDiv.style.display = 'block';
    quizTimeLeft = quizTimerSec;
    timerText.textContent = quizTimeLeft + 's';
    timerText.style.color = '#666';

    quizTimerId = setInterval(() => {
      quizTimeLeft--;
      timerText.textContent = quizTimeLeft + 's';
      if (quizTimeLeft <= 2) {
        timerText.style.color = '#ef233c';
      }
      if (quizTimeLeft <= 0) {
        quizTimeout();
      }
    }, 1000);
  }

  function clearQuizTimer() {
    if (quizTimerId) {
      clearInterval(quizTimerId);
      quizTimerId = null;
    }
  }

  function quizTimeout() {
    clearQuizTimer();
    quizTotal++;

    const buttons = document.querySelectorAll('.quiz-option');
    buttons.forEach(b => b.classList.add('disabled'));

    // Highlight correct answer
    const q = quizQueue[quizIndex];
    const isRuEn = q.direction === 'ru-en';
    const correctWordObj = allWords.find(w => w.word === q.word);
    const correctText = isRuEn ? correctWordObj.word : correctWordObj.translation;
    buttons.forEach(b => {
      if (b.textContent === correctText) b.classList.add('correct');
    });

    document.getElementById('quiz-timer-text').textContent = "Time's up!";
    document.getElementById('quiz-timer-text').style.color = '#ef233c';

    setTimeout(() => {
      quizIndex++;
      if (quizIndex >= quizQueue.length) {
        saveQuizResult(currentFile, quizCorrect, quizTotal);
        showDone(
          'Quiz done! Score: ' + quizCorrect + ' / ' + quizTotal,
          0, 0
        );
      } else {
        renderQuiz();
      }
    }, 1500);
  }

    let text = message;
    if (totalCount > 0) {
      text += '\n\nTotal progress: ' + learnedCount + ' / ' + totalCount + ' words learned.';
    }
    document.getElementById('done-message').textContent = text;

    const encourageEl = document.getElementById('done-encouragement');
    if (lastMode === 'quiz' && quizTotal > 0) {
      const pct = Math.round((quizCorrect / quizTotal) * 100);
      const result = getEncouragement(currentUsername, pct);
      const row = emojiRows[result.tier];
      document.getElementById('encourage-emojis-top').textContent = row.top;
      document.getElementById('encourage-text').textContent = result.text;
      document.getElementById('encourage-emojis-bottom').textContent = row.bottom;
      encourageEl.style.display = 'block';
      speakRussianWord(result.text.replace(/[🌟✨💪🎉🎊🌈🚀🦄💫🏆🥳⭐]/g, ''));
      playDoneAnimation();
    } else {
      encourageEl.style.display = 'none';
    }

    showScreen('screen-done');
  }

  function restartMode() {

  // ---- Firebase Save Functions ----

async function saveQuizResult(quizId, score, total) {
  const user = auth.currentUser;
  if (!user) return;

  try {
    await db.collection("users")
      .doc(user.uid)
      .collection("results")
      .add({
        type: "quiz",
        quizId: quizId,
        score: score,
        total: total,
        createdAt: new Date().toISOString()
      });
    console.log("Quiz result saved for", currentUsername);
  } catch (e) {
    console.error("Error saving quiz result:", e);
  }
}

async function getAllUsersStats() {
  try {
    const userIds = [
      "HNn9M03k1ZSsMTlNU4kjkLUn6B42",  // user1
      "H7QqXqm5otcY6rkKF0ZQztqCYG72",  // user2
      "nDEm8J6XDARkKRTFMkwccqMBJwx1"   // user3
    ];

    const filesRes = await fetch('words/files.json?t=' + Date.now());
    const files = await filesRes.json();
    const totalAvailable = files.length;

    const stats = [];

    for (const userId of userIds) {
      const resultsSnapshot = await db.collection("users")
        .doc(userId)
        .collection("results")
        .get();

      // Group by quizId, keep only the latest result per quiz
      const latestByQuiz = {};
      resultsSnapshot.docs.forEach(doc => {
        const data = doc.data();
        if (data.type === "quiz") {
          const prev = latestByQuiz[data.quizId];
          if (!prev || data.createdAt > prev.createdAt) {
            latestByQuiz[data.quizId] = data;
          }
        }
      });

      const latestResults = Object.values(latestByQuiz);
      const completedCount = latestResults.length;
      let sumScore = 0;
      let sumTotal = 0;
      latestResults.forEach(r => {
        sumScore += r.score || 0;
        sumTotal += r.total || 0;
      });

      const quizAverage = sumTotal > 0
        ? Math.round((sumScore / sumTotal) * 100)
        : 0;
      const combinedScore = totalAvailable > 0
        ? Math.round(quizAverage * (completedCount / totalAvailable))
        : 0;

      stats.push({
        userId,
        quizAverage,
        completedCount,
        totalAvailable,
        combinedScore
      });
    }

    return stats;
  } catch (e) {
    console.error("Error fetching stats:", e);
    return [];
  }
}
