<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Cards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.6rem;
      margin: 24px 0 8px;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 480px;
      padding: 0 16px 32px;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    /* ---------- Login Screen ---------- */

    .login-box {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      margin-top: 24px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color .2s;
    }

    .login-box input:focus {
      border-color: #4361ee;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s;
    }

    .login-btn:active { transform: scale(.97); }

    .login-error {
      color: #ef233c;
      font-size: .9rem;
      margin-top: 12px;
      text-align: center;
    }

    /* ---------- User Header ---------- */

    .user-header {
      width: 100%;
      max-width: 480px;
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 0;
    }

    .user-header.visible {
      display: flex;
    }

    .user-name {
      font-size: .9rem;
      color: #666;
    }

    .logout-link {
      font-size: .85rem;
      color: #ef233c;
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
      padding: 4px 8px;
    }

    /* ---------- File Select Screen ---------- */

    .file-list {
      width: 100%;
      list-style: none;
      margin-top: 16px;
    }

    .file-list li {
      background: #fff;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .15s;
    }

    .file-list li:active {
      transform: scale(.97);
    }

    .file-name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .file-progress {
      font-size: .85rem;
      color: #666;
    }

    /* ---------- Mode Select Screen ---------- */

    .mode-btn-group {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-btn {
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s, background .2s;
      color: #fff;
    }

    .mode-btn:active { transform: scale(.97); }

    .mode-btn.flip { background: #4361ee; }
    .mode-btn.quiz { background: #7209b7; }
    .mode-btn.reset { background: #e5e5e5; color: #333; font-size: .95rem; padding: 14px; }

    .back-link {
      margin-top: 16px;
      font-size: .95rem;
      color: #4361ee;
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
      padding: 8px;
    }

    /* ---------- Flip Card Screen ---------- */

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 3px;
      margin: 16px 0 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #4361ee;
      border-radius: 3px;
      transition: width .3s;
    }

    .progress-text {
      font-size: .85rem;
      color: #666;
      margin-bottom: 16px;
    }

    .card-container {
      width: 100%;
      height: 220px;
      perspective: 800px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    .card-front {
      background: #fff;
    }

    .card-back {
      background: #4361ee;
      color: #fff;
      transform: rotateY(180deg);
    }

    .card-word {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
    }

    .card-hint {
      font-size: .85rem;
      color: #999;
      margin-top: 12px;
    }

    .card-back .card-hint {
      color: rgba(255,255,255,.7);
    }

    .card-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .card-actions button {
      flex: 1;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .15s;
    }

    .card-actions button:active { transform: scale(.97); }

    .btn-know {
      background: #2dc653;
      color: #fff;
    }

    .btn-dont-know {
      background: #ef233c;
      color: #fff;
    }

    /* ---------- Quiz Screen ---------- */

    .quiz-score {
      font-size: .95rem;
      color: #666;
      margin: 16px 0 8px;
    }

    .quiz-word {
      font-size: 2rem;
      font-weight: 700;
      margin: 16px 0 24px;
      text-align: center;
    }

    .quiz-options {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      padding: 16px 20px;
      font-size: 1.05rem;
      background: #fff;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      text-align: left;
    }

    .quiz-option:active { transform: scale(.98); }

    .quiz-option.correct {
      background: #d4edda;
      border-color: #2dc653;
    }

    .quiz-option.wrong {
      background: #f8d7da;
      border-color: #ef233c;
    }

    .quiz-option.disabled {
      pointer-events: none;
    }

    /* ---------- Done Screen ---------- */

    .done-icon {
      font-size: 4rem;
      margin: 32px 0 16px;
    }

    .done-message {
      font-size: 1.2rem;
      text-align: center;
      color: #333;
      margin-bottom: 24px;
    }

    .done-btn {
      padding: 16px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform .15s;
    }

    .done-btn:active { transform: scale(.97); }
  </style>

  // ---- CSV Parsing ----
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const words = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const parts = line.split(',');
      if (parts.length < 2) continue;
      const word = parts[0].trim();
      const translation = parts.slice(1).join(',').trim();
      // Skip header row
      if (i === 0 && /^[a-z]+$/i.test(word) && /^[a-z]+$/i.test(translation)) continue;
      words.push({ word, translation });
    }
    return words;
  }

  // ---- Progress (localStorage, per user) ----
  function progressKey(file) {
    return 'ec_' + currentUsername + '_' + file;
  }

  function getProgress(file) {
    const data = localStorage.getItem(progressKey(file));
    return data ? JSON.parse(data) : [];
  }

  function saveProgress(file, learnedWords) {
    localStorage.setItem(progressKey(file), JSON.stringify(learnedWords));
  }

  function resetProgress() {
    if (confirm('Reset all progress for this word set?')) {

    }
  }

  // ---- Shuffle ----
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

}

  function selectFile(file, words) {
    currentFile = file;
    allWords = words;
    const learned = getProgress(file);
    const learnedCount = learned.filter(w => words.some(ww => ww.word === w)).length;
    document.getElementById('mode-title').textContent =

    showScreen('screen-mode');

  // Update file list display with current progress
  async function updateFileList() {
  if (filesLoadedOnce) return;      // <--- prevent double build on login
  filesLoadedOnce = true;

  try {
    const res = await fetch('words/files.json?t=' + Date.now());
    const files = await res.json();
    const list = document.getElementById('file-list');
    list.innerHTML = '';

    for (const file of files) {
      const csvRes = await fetch('words/' + file);
      const csvText = await csvRes.text();
      const words = parseCSV(csvText);
      const learned = getProgress(file);
      const learnedCount = learned.filter(w => words.some(ww => ww.word === w)).length;

      const li = document.createElement('li');
      li.innerHTML = `
        <div>
          <div class="file-name">${file.replace('.csv', '')}</div>
          <div class="file-progress">${learnedCount} / ${words.length} learned</div>
        </div>
        <div style="font-size:1.4rem; color:#999">&rsaquo;</div>
      `;
      li.onclick = () => selectFile(file, words);
      list.appendChild(li);
    }
  } catch (e) {
    document.getElementById('file-list').innerHTML =
      '<li style="color:#ef233c; justify-content:center">Failed to load word files.</li>';
  }
}


  // ---- Flip Card Mode ----
  function startFlip() {
    lastMode = 'flip';
    const learned = getProgress(currentFile);
    const unlearned = allWords.filter(w => !learned.includes(w.word));

    if (unlearned.length === 0) {
      showDone('You\'ve learned all the words!', allWords.length, allWords.length);
      return;
    }

    flipQueue = shuffle(unlearned);
    flipIndex = 0;
    flipLearned = 0;
    showScreen('screen-flip');
    renderFlipCard();
  }

  function renderFlipCard() {
    const card = document.getElementById('flip-card');
    card.classList.remove('flipped');
    const w = flipQueue[flipIndex];
    document.getElementById('flip-word').textContent = w.word;
    document.getElementById('flip-translation').textContent = w.translation;

    const total = flipQueue.length;
    const pct = Math.round((flipIndex / total) * 100);
    document.getElementById('flip-progress-bar').style.width = pct + '%';
    document.getElementById('flip-progress-text').textContent =
      (flipIndex + 1) + ' / ' + total + ' remaining';
    speakWord(w.word);
  }

  }

  // ---- Quiz Mode ----
  function startQuiz() {
    lastMode = 'quiz';
    const learned = getProgress(currentFile);
    const unlearned = allWords.filter(w => !learned.includes(w.word));

    if (unlearned.length === 0) {
      showDone('You\'ve learned all the words!', allWords.length, allWords.length);
      return;
    }

    quizQueue = shuffle(unlearned);
    quizIndex = 0;
    quizCorrect = 0;
    quizTotal = 0;
    showScreen('screen-quiz');
    renderQuiz();
  }

  function renderQuiz() {
    const w = quizQueue[quizIndex];
    document.getElementById('quiz-word').textContent = w.word;
    document.getElementById('quiz-score').textContent =
      'Score: ' + quizCorrect + ' / ' + quizTotal + '  |  ' + (quizIndex + 1) + ' of ' + quizQueue.length;
    speakWord(w.word);
    // Build options: 1 correct + 3 distractors
    const distractors = allWords
      .filter(d => d.word !== w.word)
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);

    const options = shuffle([w, ...distractors]);
    const container = document.getElementById('quiz-options');
    container.innerHTML = '';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option';
      btn.textContent = opt.translation;
      btn.onclick = () => quizAnswer(btn, opt.word === w.word, w.word);
      container.appendChild(btn);
    });
    
  }

  function quizAnswer(btn, isCorrect, correctWord) {
    quizTotal++;
    const buttons = document.querySelectorAll('.quiz-option');
    buttons.forEach(b => b.classList.add('disabled'));

    if (isCorrect) {
      btn.classList.add('correct');
      quizCorrect++;
      // Mark as learned
      const learned = getProgress(currentFile);
      if (!learned.includes(correctWord)) {
        learned.push(correctWord);
        saveProgress(currentFile, learned);
        // Update mode title with new learned count
        document.getElementById('mode-title').textContent =
          currentFile.replace('.csv', '') + ' (' + learned.length + '/' + allWords.length + ' learned)';
      }
    } else {
      btn.classList.add('wrong');
      // Highlight correct answer
      buttons.forEach(b => {
        const correctTranslation = allWords.find(w => w.word === correctWord).translation;
        if (b.textContent === correctTranslation) b.classList.add('correct');
      });
    }

    setTimeout(() => {
      quizIndex++;
      if (quizIndex >= quizQueue.length) {
        const learned = getProgress(currentFile);
            // Save quiz result to Firebase
        saveQuizResult(currentFile, quizCorrect, quizTotal);
        showDone(
          'Quiz done! Score: ' + quizCorrect + ' / ' + quizTotal,
          learned.length, allWords.length
        );
      } else {
        renderQuiz();
      }
    }, 1200);
  }

  // ---- Done Screen ----
  function showDone(message, learnedCount, totalCount) {
    document.getElementById('done-message').textContent =
      message + '\n\nTotal progress: ' + learnedCount + ' / ' + totalCount + ' words learned.';
    showScreen('screen-done');
  }

  function restartMode() {
    if (lastMode === 'flip') startFlip();
    else if (lastMode === 'quiz') startQuiz();
  }

  // ---- Firebase Save Functions ----

async function saveQuizResult(quizId, score, total) {
  const user = auth.currentUser;
  if (!user) return;

  try {
    await db.collection("users")
      .doc(user.uid)
      .collection("results")
      .add({
        type: "quiz",
        quizId: quizId,
        score: score,
        total: total,
        createdAt: new Date().toISOString()
      });
    console.log("Quiz result saved for", currentUsername);
  } catch (e) {
    console.error("Error saving quiz result:", e);
  }
}

  try {

        type: "card",

        correct: correct,
        createdAt: new Date().toISOString()
      });
    console.log("Card result saved for", currentUsername);
  } catch (e) {
    console.error("Error saving card result:", e);
  }
}

async function showStats() {
  showScreen('screen-stats');
  
  // Show my stats
  const myStats = await getMyStats();
  const myStatsDiv = document.getElementById('my-stats-content');
  
  if (myStats && (myStats.quizCount > 0 || myStats.cardCount > 0)) {
    myStatsDiv.innerHTML = `
      <p><strong>Quizzes completed:</strong> ${myStats.quizCount}</p>
      <p><strong>Quiz average:</strong> ${myStats.quizAverage}% (${myStats.quizTotalScore}/${myStats.quizTotalQuestions})</p>
      <p><strong>Cards practiced:</strong> ${myStats.cardCount}</p>
      <p><strong>Card accuracy:</strong> ${myStats.cardAccuracy}% (${myStats.cardCorrect}/${myStats.cardCount})</p>
    `;
  } else {
    myStatsDiv.innerHTML = '<p style="color:#999">No data yet. Start practicing!</p>';
  }
  
  // Show leaderboard
  const allStats = await getAllUsersStats();
  const leaderboardDiv = document.getElementById('leaderboard-content');
  
  console.log("All stats:", allStats); // Debug line
  
  if (allStats.length === 0) {
    leaderboardDiv.innerHTML = '<p style="color:#999">No users have completed any activities yet</p>';
    return;
  }
  
  // Filter out users with no activity
  const activeStats = allStats.filter(s => s.quizCount > 0 || s.cardCount > 0);
  
  if (activeStats.length === 0) {
    leaderboardDiv.innerHTML = '<p style="color:#999">No users have completed any activities yet</p>';
    return;
  }
  
  // Sort by quiz average (users with no quizzes go to bottom)
  activeStats.sort((a, b) => {
    if (a.quizCount === 0) return 1;
    if (b.quizCount === 0) return -1;
    return b.quizAverage - a.quizAverage;
  });
  
  let html = '<table style="width:100%; border-collapse:collapse">';
  html += '<tr style="border-bottom:2px solid #eee; font-weight:600; color:#666; font-size:.85rem">';
  html += '<th style="text-align:left; padding:8px">Rank</th>';
  html += '<th style="text-align:left; padding:8px">User</th>';
  html += '<th style="text-align:center; padding:8px">Quizzes</th>';
  html += '<th style="text-align:center; padding:8px">Avg %</th>';
  html += '</tr>';
  
  activeStats.forEach((stat, index) => {
    const isMe = stat.userId === auth.currentUser.uid;
    const bgColor = isMe ? '#e7f3ff' : 'transparent';
    const medal = index === 0 ? '🥇 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : '';
    
    // Show UID shortened or "You"
    const displayName = (uidToUsername[stat.userId] || stat.userId.substring(0, 8)) + (isMe ? ' (You)' : '');

    html += `<tr style="background:${bgColor}; border-bottom:1px solid #eee">`;
    html += `<td style="padding:12px 8px; font-size:.9rem">${medal}${index + 1}</td>`;
    html += `<td style="padding:12px 8px; font-weight:${isMe ? '600' : '400'}; font-size:.9rem">${displayName}</td>`;
    html += `<td style="padding:12px 8px; text-align:center; font-size:.9rem">${stat.quizCount}</td>`;
    html += `<td style="padding:12px 8px; text-align:center; font-size:.9rem; font-weight:600; color:#4361ee">${stat.quizAverage}%</td>`;
    html += '</tr>';
  });
  
  html += '</table>';
  leaderboardDiv.innerHTML = html;
}
